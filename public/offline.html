<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8b5cf6" />
    <title>ANOTA — sem conexão</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font: 16px system-ui, sans-serif; color: #27232f; background: #f6f4fa; }
      main { max-width: 420px; text-align: center; }
      strong { display: grid; width: 52px; height: 52px; margin: 0 auto 20px; place-items: center; border-radius: 16px; color: white; background: #8b5cf6; font-size: 24px; }
      h1 { font-size: 1.5rem; }
      p { color: #686473; line-height: 1.6; }
      button { margin-top: 12px; border: 0; border-radius: 12px; padding: 12px 20px; color: white; background: #8b5cf6; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <strong aria-hidden="true">A</strong>
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet e tente novamente. Suas anotações salvas neste dispositivo continuam protegidas.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
